name: Upstream releases

# Weekly, or by hand: look for Xray-core releases above the floor that the
# fixture does not have, regenerate, and open a PR. Never a release: if the
# coverage test fails in the PR, a human reads the new tag and updates the
# zod schemas.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Clone Xray-core
        run: git clone --quiet https://github.com/XTLS/Xray-core.git "$RUNNER_TEMP/Xray-core"

      - name: Regenerate for new releases
        id: upstream
        run: bun run scripts/upstream.ts "$RUNNER_TEMP/Xray-core" --body "$RUNNER_TEMP/body.md"

      - name: Open a pull request
        if: steps.upstream.outputs.new != ''
        env:
          # A PR opened with GITHUB_TOKEN does not start CI on itself; set an
          # UPSTREAM_TOKEN secret (a fine-grained PAT) to have it run.
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN || github.token }}
          NEW: ${{ steps.upstream.outputs.new }}
          COVERAGE: ${{ steps.upstream.outputs.coverage }}
        run: |
          branch="upstream/$(echo "$NEW" | tr ' ' '_')"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; its PR is still open or was closed on purpose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/core-keys.json schema/
          git commit -m "chore(upstream): Xray-core $NEW" -m "Regenerated by .github/workflows/upstream.yml; coverage test: $COVERAGE."
          git push origin "$branch"
          title="Xray-core $NEW"
          [ "$COVERAGE" = fail ] && title="$title — schemas need updating"
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
