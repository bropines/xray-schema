name: Release

# On a version tag: check everything once more, then attach the npm tarball
# and the JSON Schemas to the GitHub Release. Publishing to npm is left to a
# person (`npm publish` from the same tag).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: The tag is the package version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json says $version"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun test
      - run: bun run schema:build --check

      - name: Pack
        run: npm pack

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" xray-schema-*.tgz schema/*.schema.json --clobber
